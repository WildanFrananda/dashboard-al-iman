services:
  app:
    build:
      context: .
      dockerfile: docker/server/Dockerfile.prod
    container_name: dashboard-al-iman-app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - storage_uploads:/app/storage/app/uploads
      - app_logs:/app/storage/logs
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: dashboard_al_iman
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      OCTANE_SERVER: frankenphp
      SENTRY_LARAVEL_DSN: "${SENTRY_LARAVEL_DSN}"
      SENTRY_TRACES_SAMPLE_RATE: "0.5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app-network
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.5'
    #       memory: 1G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 512M

  postgres:
    image: postgres:17-alpine
    container_name: dashboard-al-iman-postgres
    restart: unless-stopped
    command: postgres -c max_connections=100 -c shared_buffers=128MB
    environment:
      POSTGRES_DB: dashboard_al_iman
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: dashboard-al-iman-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  minio:
    image: minio/minio:latest
    container_name: dashboard-al-iman-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: docker/server/Dockerfile.prod
    restart: unless-stopped
    command: php /app/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --queue=default,high,low
    volumes:
      - storage_uploads:/app/storage/app/uploads
      - app_logs:/app/storage/logs
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: dashboard_al_iman
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SENTRY_LARAVEL_DSN: "${SENTRY_LARAVEL_DSN}"
      SENTRY_TRACES_SAMPLE_RATE: "0.5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      replicas: 2
    healthcheck:
      disable: true
      # resources:
      #   limits:
      #     cpus: '0.5'
      #     memory: 512M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_uploads:
    driver: local
  minio_data:
    driver: local
  app_logs:
    driver: local

networks:
  app-network:
    driver: bridge