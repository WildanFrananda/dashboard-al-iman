[PHP]
memory_limit = 512M
upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 60 ; Di Prod jangan terlalu lama (kecuali worker)
max_input_time = 60
expose_php = Off        ; Security: Sembunyikan versi PHP
display_errors = Off    ; Security: Jangan tampilkan error ke user
log_errors = On
error_log = /var/log/php_errors.log
date.timezone = Asia/Jakarta
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Session Prod (Pakai DB 1)
session.save_handler = redis
session.save_path = "tcp://redis:6379?database=1"

[opcache]
; PROD: AKTIFKAN AGAR NGEBUT
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 32531
opcache.save_comments = 1

; PROD: JANGAN CEK TIMESTAMP
; PHP akan menganggap file tidak pernah berubah sampai container di-restart.
; Ini mengurangi I/O Disk secara drastis.
opcache.validate_timestamps = 0 

; JIT (Hanya untuk Prod)
opcache.jit = tracing
opcache.jit_buffer_size = 128M

[Exceptions]
; Sentry Integration
zend.exception_ignore_args = Off